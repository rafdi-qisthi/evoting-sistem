<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuaraKita | Keamanan Akun</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css?v=3">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .card-header h2 {
            font-family: 'Fraunces', serif;
            font-size: 24px;
            color: var(--gold-mid);
            margin-bottom: 10px;
        }

        .card-header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            font-size: 14px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--gold-mid);
        }

        .btn-masuk {
            width: 100%;
            padding: 14px;
            background: var(--gold-gradient);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-masuk:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="card-header">
            <h2>🛡️ Amankan Akun Anda</h2>
            <p>Sistem mendeteksi Anda menggunakan password bawaan. Demi kerahasiaan suara, mohon ubah password Anda
                sekarang.</p>
        </div>

        <div class="input-group">
            <label>Password Baru</label>
            <input type="password" id="pass1" placeholder="Masukkan password baru..." autocomplete="off">
        </div>
        <div class="input-group">
            <label>Konfirmasi Password Baru</label>
            <input type="password" id="pass2" placeholder="Ketik ulang password baru..." autocomplete="off">
        </div>

        <button class="btn-masuk" id="btnSimpan" onclick="simpanPassword()">Simpan & Lanjutkan</button>
    </div>

    <!-- Panggil Skrip Global untuk Modal Peringatan -->
    <script src="/js/global.js"></script>
    <script>
        const activeUser = sessionStorage.getItem("activeUser");
        if (!activeUser) window.location.href = "/login.html";

        async function simpanPassword() {
            const pass1 = document.getElementById('pass1').value.trim();
            const pass2 = document.getElementById('pass2').value.trim();
            const btn = document.getElementById('btnSimpan');

            if (!pass1 || !pass2) return showCustomModal("Password tidak boleh kosong!", "alert");
            if (pass1 !== pass2) return showCustomModal("Konfirmasi password tidak cocok!", "alert");
            if (pass1 === activeUser) return showCustomModal("Password baru tidak boleh sama dengan username!", "alert");
            if (pass1.length < 6) return showCustomModal("Password minimal 6 karakter!", "alert");

            btn.innerText = "MENYIMPAN..."; btn.disabled = true;

            try {
                const response = await fetch('/api/ubah-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: activeUser, passwordBaru: pass1 })
                });

                // KITA TANGKAP PESAN ERROR ASLINYA DI SINI
                let result;
                try {
                    result = await response.json();
                } catch (e) {
                    result = { error: "Terjadi kesalahan rute 404. Pastikan file API ada di folder functions/api" };
                }

                if (response.ok) {
                    await showCustomModal("Password berhasil diubah! Anda akan dialihkan ke Bilik Suara.", "success");
                    window.location.href = "/dashboard.html";
                } else {
                    // Tampilkan pesan error yang sebenarnya
                    showCustomModal("Gagal: " + (result.error || result.detail || "Server Error"), "alert");
                    btn.innerText = "Simpan & Lanjutkan"; btn.disabled = false;
                }
            } catch (err) {
                showCustomModal("Koneksi terputus: " + err.message, "alert");
                btn.innerText = "Simpan & Lanjutkan"; btn.disabled = false;
            }
        }
    </script>
</body>

</html>
