<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuaraKita | Login Sistem</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <style>
        /* CSS Khusus Login */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .avatar-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--gold-gradient);
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .avatar-icon svg {
            width: 32px;
            height: 32px;
            fill: #000;
        }

        .card-header h2 {
            font-family: 'Fraunces', serif;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-header p {
            font-size: 13.5px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .label-row label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .forgot-link {
            font-size: 11px;
            color: var(--gold-mid);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .forgot-link:hover {
            color: var(--gold-light);
            text-decoration: underline;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg.icon-left {
            position: absolute;
            left: 15px;
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
            transition: fill 0.3s;
        }

        .input-wrapper svg.icon-right {
            position: absolute;
            right: 15px;
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            cursor: pointer;
            transition: fill 0.3s;
        }

        .input-wrapper svg.icon-right:hover {
            fill: var(--gold-mid);
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 45px 15px 45px;
            font-size: 14.5px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s;
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .input-wrapper input:focus {
            border-color: var(--gold-mid);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        .error {
            background-color: rgba(220, 53, 69, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .btn-masuk {
            width: 100%;
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--gold-gradient);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-masuk:hover {
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .btn-masuk:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--border-subtle);
        }

        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-link a:hover {
            color: var(--gold-mid);
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="card-header">
            <div class="avatar-icon"><svg viewBox="0 0 24 24">
                    <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg></div>
            <h2>Selamat Datang!</h2>
            <p>Masuk untuk mengakses bilik suara digital</p>
        </div>

        <div id="pesanError" class="error"></div>

        <div class="input-group">
            <div class="label-row"><label>Username / Kredensial</label></div>
            <div class="input-wrapper">
                <svg class="icon-left" viewBox="0 0 24 24">
                    <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
                <input type="text" id="usernameInput" placeholder="Masukkan kredensial Anda..." autocomplete="off">
            </div>
        </div>

        <div class="input-group">
            <div class="label-row">
                <label>Password</label>
                <!-- UBAH NOMOR WA DI SINI (Ganti 6281234567890 dengan nomor Anda) -->
                <a href="https://wa.me/6281234567890?text=Halo%20Admin%20Panitia,%20saya%20lupa%20password%20akun%20e-voting%20saya.%20Mohon%20bantuannya." target="_blank" class="forgot-link">Lupa Password?</a>
            </div>
            <div class="input-wrapper">
                <svg class="icon-left" viewBox="0 0 24 24">
                    <path
                        d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                </svg>
                <input type="password" id="passwordInput" placeholder="••••••••">
                <svg class="icon-right" id="togglePassword" viewBox="0 0 24 24">
                    <path
                        d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                </svg>
            </div>
        </div>

        <button id="btnMasuk" class="btn-masuk" onclick="prosesLogin()">Masuk</button>

        <div class="back-link">
            <a href="/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg> Kembali ke Beranda</a>
        </div>
    </div>
    <div class="footer-text">&copy; 2026 SuaraKita — Hak Cipta Dilindungi</div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            if (type === 'text') {
                this.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
            } else {
                this.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        });

        async function prosesLogin() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const pesanError = document.getElementById('pesanError');
            const btn = document.getElementById('btnMasuk');

            if (!username || !password) { pesanError.innerText = "Isi data!"; pesanError.style.display = "block"; return; }
            btn.innerText = "MEMERIKSA..."; btn.disabled = true; pesanError.style.display = "none";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                const result = await response.json();

                if (response.ok) {
                    sessionStorage.setItem("activeUser", username);
                    sessionStorage.setItem("userRole", result.role);

                    // LOGIKA BARU: Admin & Demo masuk ke Panel Admin
                    if (result.role === 'admin' || result.role === 'demo') {
                        window.location.href = "/admin.html";
                    } else {
                        if (result.is_published === '1' || result.status_voting === 1) {
                            window.location.href = "/hasil-publik.html";
                        } else {
                            window.location.href = "/dashboard.html";
                        }
                    }
                } else {
                    pesanError.innerText = result.error; pesanError.style.display = "block"; btn.innerText = "MASUK"; btn.disabled = false;
                }
            } catch (error) {
                pesanError.innerText = "Server error."; pesanError.style.display = "block"; btn.innerText = "MASUK"; btn.disabled = false;
            }
        }
        document.addEventListener('keypress', function (e) { if (e.key === 'Enter') prosesLogin(); });
    </script>
</body>

</html>
